[project]
name = "dedrm"
version = "0.2.0"
description = "CLI to remove Adobe Digital Editions (Adept) DRM from ePub files."
readme = "README.md"
authors = [
    { name = "yun-sangho", email = "contact@yunsangho.com" }
]
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "asn1crypto>=1.5",
    "oscrypto>=1.3",
    "pycryptodome>=3.20",
]

[project.scripts]
dedrm = "dedrm.cli:main"

[dependency-groups]
dev = [
    "cryptography>=42",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dedrm"]
